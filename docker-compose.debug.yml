services:
  djangosite:
    image: djangosite
    build:
      context: .
      dockerfile: ./Dockerfile
    command: [
      "sh", "-c",
      "pip install --no-cache-dir debugpy -t /tmp/debugpy && PYTHONPATH=/tmp/debugpy python -m debugpy --wait-for-client --listen 0.0.0.0:5678 -m django runserver 0.0.0.0:8000 --noreload"
    ]
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 8000:8000
      - 5678:5678
