[project]
name = "djangosite"
version = "0.1.0"
description = "Django + PostgreSQL + pgAdmin Docker boilerplate"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.uv]
# This is an application, not a library — don't build/install the project itself.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
